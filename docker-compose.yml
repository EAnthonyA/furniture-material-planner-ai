services:
  migrate:
    build:
      context: .
      target: worker
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://planner:planner@postgres:5432/furniture_planner?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://planner:planner@postgres:5432/furniture_planner?schema=public
      STORAGE_ROOT: /var/lib/furniture-planner/uploads
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - private_storage:/var/lib/furniture-planner
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://planner:planner@postgres:5432/furniture_planner?schema=public
      STORAGE_ROOT: /var/lib/furniture-planner/uploads
    volumes:
      - private_storage:/var/lib/furniture-planner
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: furniture_planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 stores its cluster in a major-versioned subdirectory.
      # Mount the parent path to preserve the layout required for future upgrades.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d furniture_planner"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  private_storage:
