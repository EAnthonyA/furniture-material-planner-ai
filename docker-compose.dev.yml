services:
  web:
    build:
      target: worker
    command:
      ["sh", "-c", "pnpm db:generate && pnpm dev --webpack --hostname 0.0.0.0"]
    environment:
      NODE_ENV: development
      # Colima bind mounts can drop filesystem-change events. Webpack's polling
      # watcher keeps Fast Refresh reliable when source lives on the macOS host.
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
      - private_storage:/var/lib/furniture-planner

  worker:
    command: ["./node_modules/.bin/tsx", "watch", "src/worker/index.ts"]
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
      - private_storage:/var/lib/furniture-planner

volumes:
  web_node_modules:
  web_next:
  worker_node_modules:
